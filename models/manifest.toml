# Every model the engine may load. A file whose hash does not match is
# refused; nothing here is ever downloaded at runtime. Add an entry with
# `sha256sum models/<file>` after exporting or fetching a model.

[[model]]
name    = "yolo11n-coco"
task    = "detect"
file    = "yolo11n-coco-640.onnx"
input   = [640, 640]
classes = ["person", "...", "sports ball"]   # COCO 80; the engine maps 0 and 32
sha256  = "0db36d9937c48a05c06e297b059110dd53b035ea507bd3f687988aa021272d65"
licence = "AGPL-3.0 (Ultralytics) — free for development and open-source use; see docs/ARCHITECTURE.md §13"

