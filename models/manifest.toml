# Every model the engine may load.
#
# WHY MOST ENTRIES HAVE NO HASH. These models are EXPORTED on each machine by
# `scripts/export-models.py`, and PyTorch/ONNX do not produce byte-identical
# files across architectures — the same weights exported on x86 Linux and on
# arm64 macOS differ. A hash committed here would therefore be wrong for
# everybody except the machine that generated it, and "HASH MISMATCH" on a
# correct file teaches people to ignore the check.
#
# So: a hash is recorded for models we DISTRIBUTE (where the bytes are fixed
# and tampering is the thing being guarded against), and omitted for models
# each user exports. `export-models.py` writes the locally-exported hashes to
# `models/local.toml`, which is gitignored and checked the same way — so a
# model that changes UNDER YOU is still caught, without false alarms.

[[model]]
name    = "yolo11n-coco"
task    = "detect"
file    = "yolo11n-coco-640.onnx"
input   = [640, 640]
classes = ["person", "...", "sports ball"]   # COCO 80; the engine maps 0 and 32
sha256  = ""   # exported locally; see local.toml
licence = "AGPL-3.0 (Ultralytics) — free for development and open-source use; see docs/ARCHITECTURE.md §13"

[[model]]
name    = "yolo11n-coco-384x672"
task    = "detect"
file    = "yolo11n-coco-384x672.onnx"
input   = [384, 672]
classes = ["person", "...", "sports ball"]
sha256  = ""   # exported locally; see local.toml
licence = "AGPL-3.0 (Ultralytics)"


